<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Library - Low Stress Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Nunito', sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            background-color: #F4F7F6; 
            color: #333; 
        }
        h1 { 
            color: #2D3748; 
            margin-bottom: 10px; 
            font-size: 2rem;
        }
        p { 
            color: #4A5568; 
            margin-bottom: 40px; 
            font-size: 1.1rem;
        }
        a { 
            display: block; 
            margin: 15px auto; 
            padding: 20px; 
            text-decoration: none; 
            border-radius: 12px; 
            max-width: 350px; 
            font-size: 1.2rem; 
            font-weight: 800; 
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        a:active {
            transform: scale(0.98);
        }
        
        /* Special Styling for the 30-Second Quizzes */
        .low-stress-link { 
            background: #48BB78; 
            color: white; 
        }
        .low-stress-link:hover { 
            background: #38A169; 
        }
        
        /* Styling for standard quizzes if you add them later */
        .standard-link { 
            background: #4299E1; 
            color: white;
        }
        .standard-link:hover { 
            background: #3182CE; 
        }
    </style>
</head>
