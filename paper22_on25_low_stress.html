<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Stress Review: Science Paper 22 (Oct/Nov 2025)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #F4F7F6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .quiz-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 700px;
            width: 90%;
            text-align: left;
            position: relative;
        }

        h1 {
            font-size: 1.4rem;
            color: #8892B0;
            margin-top: 0;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2D3748;
            margin-bottom: 15px;
        }
        
        .sub-points {
            background-color: #f8fafc;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #cbd5e1;
            margin-bottom: 20px;
        }
        
        .sub-points ul {
            margin: 0;
            padding-left: 20px;
            font-size: 1.1rem;
            color: #475569;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }

        .option-item {
            background-color: #EDF2F7;
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            color: #4A5568;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #E2E8F0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background-color: #48BB78;
            width: 0%;
            transition: width 30s linear;
        }

        .answer-box {
            background-color: #E6FFFA;
            border-left: 5px solid #319795;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .answer-title {
            font-weight: 800;
            color: #285E61;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .explanation {
            margin-bottom: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .trap-box {
            background-color: #FFF5F5;
            border-left: 5px solid #E53E3E;
            padding: 15px;
            border-radius: 5px;
        }

        .trap-title {
            font-weight: 800;
            color: #C53030;
            margin-bottom: 5px;
        }

        .btn-start, .btn-next {
            background-color: #4299E1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .btn-start:hover, .btn-next:hover {
            background-color: #3182CE;
        }

        .btn-next {
            display: none;
            background-color: #48BB78;
        }
        .btn-next:hover {
            background-color: #38A169;
        }

    </style>
</head>
<body>

    <div class="quiz-container" id="intro-screen">
        <h
